name: Node.js CI

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ "main" ]
    types: [ closed, merged ]

env:
  GCP_AUTH_WORKLOAD_IDENTITY_PROVIDER: projects/592763168884/locations/global/workloadIdentityPools/goflink-github-actions/providers/github-actions
  GCP_AUTH_SERVICE_ACCOUNT: flinkord-cli@flink-core-shared.iam.gserviceaccount.com
  NODE_VERSION: 18.x
  IDENTITY_SECRET: ${{secrets.IDENTITY_SECRET}}
  GENERIC_PASSWORD: ${{secrets.GENERIC_PASSWORD}}

permissions:
  id-token: write
  contents: write # This is required for actions/checkout@v3

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - id: auth
        name: Authenticate to GCP
        uses: google-github-actions/auth@v0
        with:
          token_format: access_token
          workload_identity_provider: ${{ env.GCP_AUTH_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_AUTH_SERVICE_ACCOUNT }}

      # get a new auth token and set it to a temp npm configuration
      - name: Get auth for artifact registry
        run: npx google-artifactregistry-auth
      - name: 'Create env file'
        run: |
          echo "${{ secrets.CT_ENV_FILE }}" > .env
      - name: Install dependencies
        run: |
          npx google-artifactregistry-auth
          npm ci --cache .npm

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build --if-present

      - name: Run tests
        run: npm run test
        continue-on-error: true

      - name: Remove env file
        run: rm -f .env

      - name: Set git user
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global user.email "flinkord-cli-helper@goflink.com"
          git config --global user.name "flinkord-cli-helper"

      - name: Bump version and push tag
        if: github.ref == 'refs/heads/main'
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push new version
        if: github.ref == 'refs/heads/main'
        run: |
          npm version ${{ steps.tag_version.outputs.new_version }}
          git push

      - name: Create a GitHub release
        uses: ncipollo/release-action@v1
        if: github.ref == 'refs/heads/main'
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          prerelease: true

      - name: Publish module
        if: github.ref == 'refs/heads/main'
        working-directory: '.'
        run: |
          npm publish --no-git-checks
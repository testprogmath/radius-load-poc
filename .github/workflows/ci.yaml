name: Node.js CI

on:
  pull_request:
    branches:
      - main

env:
  GCP_AUTH_WORKLOAD_IDENTITY_PROVIDER: projects/592763168884/locations/global/workloadIdentityPools/goflink-github-actions/providers/github-actions
  GCP_AUTH_SERVICE_ACCOUNT: flinkord-cli@flink-core-shared.iam.gserviceaccount.com
  NODE_VERSION: 23.x
  IDENTITY_SECRET: ${{secrets.IDENTITY_SECRET}}
  GENERIC_PASSWORD: ${{secrets.GENERIC_PASSWORD}}

permissions:
  id-token: write
  contents: write # This is required for actions/checkout@v4
  pages: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - id: auth
        name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ env.GCP_AUTH_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_AUTH_SERVICE_ACCOUNT }}

      # get a new auth token and set it to a temp npm configuration
      - name: Get auth for artifact registry
        run: npx google-artifactregistry-auth
      - name: 'Create env file'
        run: |
          echo "${{ secrets.CT_ENV_FILE }}" > .env
      - name: Install dependencies
        run: |
          npx google-artifactregistry-auth
          npm ci --cache .npm

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build --if-present

      - name: Run tests
        run: npm run test

      - name: Remove env file
        run: rm -f .env

      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Test Report to GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: html-report/

      - name: Deploy to GitHub Pages
        if: always()
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Publish the test result link on PR
        uses: NejcZdovc/comment-pr@v2
        if: always()
        with:
          identifier: "GITHUB_COMMENT_E2E_TESTS"
          message: |
            # 🧪 E2E tests
            
            Your merged e2e test report is available here:
            
            🔗 [Jest Report](https://goflink.github.io/flinkord-cli/)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


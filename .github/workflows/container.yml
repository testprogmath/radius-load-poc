name: Build and Publish Container

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: europe-west3-docker.pkg.dev
  GCP_PROJECT: flink-core-shared
  IMAGE_NAME: flinkord-cli
  service_name: flinkord-cli
  GCP_AUTH_WORKLOAD_IDENTITY_PROVIDER: projects/592763168884/locations/global/workloadIdentityPools/goflink-github-actions/providers/github-actions
  GCP_AUTH_SERVICE_ACCOUNT: flinkord-cli@flink-core-shared.iam.gserviceaccount.com

permissions:
  id-token: write
  contents: read
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - id: auth
      name: Authenticate to GCP
      uses: google-github-actions/auth@v3
      with:
        token_format: access_token
        workload_identity_provider: "${{ env.GCP_AUTH_WORKLOAD_IDENTITY_PROVIDER }}"
        service_account: "${{ env.GCP_AUTH_SERVICE_ACCOUNT }}"

    - name: Login to Google artifact registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: oauth2accesstoken
        password: "${{ steps.auth.outputs.access_token }}"

    - name: Auth Flink NPM registry
      run: |
        npx google-artifactregistry-auth --repo-config=./.npmrc --credential-config=./.npmrc

    - name: Create embedded key file for Docker build
      run: |
        mkdir -p keys
        cat > keys/embedded-key.js << 'EOF'
        // Embedded Age key for flinkord-cli
        // This contains both public and private keys for decryption
        
        const privateKeyParts = [
          '${{ secrets.AGE_PRIVATE_KEY_PART1 }}',
          '${{ secrets.AGE_PRIVATE_KEY_PART2 }}'
        ];
        
        const publicKeyParts = [
          '${{ secrets.AGE_PUBLIC_KEY_PART1 }}',
          '${{ secrets.AGE_PUBLIC_KEY_PART2 }}'
        ];
        
        // Simple obfuscation function
        const getEmbeddedAgeKey = () => {
          return privateKeyParts.join('');
        };
        
        const getEmbeddedAgePublicKey = () => {
          return publicKeyParts.join('');
        };
        
        export { getEmbeddedAgeKey, getEmbeddedAgePublicKey };
        EOF

    - uses: goflink/github-actions/build-push-image@v2
      with:
        build_args: |
          LAST_TAG=${{ steps.previoustag.outputs.tag }}
        app_name: ${{ env.service_name }}
        platforms: linux/amd64,linux/arm64
        security_check_enabled: 'true'

name: Release & Publish flinkord-cli

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Bump type: major, minor, patch'
        required: false
        default: 'patch'
      tag:
        description: 'Tag to publish (e.g. v1.2.3)'
        required: false

permissions:
  id-token: write
  contents: write

env:
  GCP_AUTH_WORKLOAD_IDENTITY_PROVIDER: projects/592763168884/locations/global/workloadIdentityPools/goflink-github-actions/providers/github-actions
  GCP_AUTH_SERVICE_ACCOUNT: flinkord-cli@flink-core-shared.iam.gserviceaccount.com
  NODE_VERSION: 24.x
  IDENTITY_SECRET: ${{ secrets.IDENTITY_KEY }}
  GENERIC_PASSWORD: ${{ secrets.GENERIC_PASSWORD }}

jobs:
  release_and_publish:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CT_CLIENT_ID: ${{ secrets.CT_CLIENT_ID }}
      CT_CLIENT_SECRET: ${{ secrets.CT_CLIENT_SECRET }}
      IDENTITY_KEY: ${{ secrets.IDENTITY_KEY }}
      GENERIC_PASSWORD: ${{ secrets.GENERIC_PASSWORD }}
      INVENTORY_SERVICE_TOKEN: ${{ secrets.INVENTORY_SERVICE_TOKEN }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: ${{ env.GCP_AUTH_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_AUTH_SERVICE_ACCOUNT }}

      - name: Install dependencies
        run: |
          npx google-artifactregistry-auth
          npm ci --cache .npm

      - name: Build the project
        run: npm run build --if-present

      - name: Automatic Versioning
        id: versioning
        uses: goflink/github-actions/automatic-versioning@v2
        continue-on-error: true
        with:
          bump: ${{ github.event.inputs.bump || 'patch' }}
          dry_run: "false"
          with_prefix: "v"
          create_github_release: "true"

      - name: Create .env file
        run: |
          echo 'CT_PROJECT_KEY="flink-staging"' > .env
          echo "CT_CLIENT_ID=\"$CT_CLIENT_ID\"" >> .env
          echo "CT_CLIENT_SECRET=\"$CT_CLIENT_SECRET\"" >> .env
          echo "IDENTITY_KEY=\"$IDENTITY_KEY\"" >> .env
          echo "GENERIC_PASSWORD=\"$GENERIC_PASSWORD\"" >> .env
          echo "INVENTORY_SERVICE_TOKEN=\"$INVENTORY_SERVICE_TOKEN\"" >> .env
          echo "FIREBASE_API_KEY=\"$FIREBASE_API_KEY\"" >> .env

      - name: Set VERSION env var
        run: |
          if [[ "${{ github.event.inputs.tag }}" != "" ]]; then
            echo "VERSION=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          elif [[ "${{ steps.versioning.outputs.version }}" != "" ]]; then
            echo "VERSION=${{ steps.versioning.outputs.version }}" >> $GITHUB_ENV
          else
            echo "No new version generated; skipping tag creation."
          fi

      - name: Log computed version
        run: echo "Computed version is $VERSION"

      - name: Update package.json version
        run: |
          echo "Using version $VERSION"
          npm version ${VERSION#v} --no-git-tag-version

      - name: Publish module
        run: npm publish --tag latest --no-git-checks

      - name: Remove .env file
        run: rm -f .env dist/.env
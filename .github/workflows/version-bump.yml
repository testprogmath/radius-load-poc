name: Bump version on PR merge

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches:
      - main
    types: [closed]

env:
  GCP_AUTH_WORKLOAD_IDENTITY_PROVIDER: projects/592763168884/locations/global/workloadIdentityPools/goflink-github-actions/providers/github-actions
  GCP_AUTH_SERVICE_ACCOUNT: flinkord-cli@flink-core-shared.iam.gserviceaccount.com
  NODE_VERSION: 18.x
  IDENTITY_SECRET: ${{secrets.IDENTITY_SECRET}}
  GENERIC_PASSWORD: ${{secrets.GENERIC_PASSWORD}}

permissions:
  id-token: write
  contents: write # This is required for actions/checkout@v3

jobs:
  bump-version:
    if: github.event.pull_request.merged == true && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ env.GCP_AUTH_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_AUTH_SERVICE_ACCOUNT }}

      - name: Install dependencies
        run: |
          npx google-artifactregistry-auth
          npm ci --cache .npm

      - name: Build application
        run: npm run build --if-present

      - name: Bump version and push tag
        run: |
          git config --global user.email "flinkord-cli-helper@goflink.com"
          git config --global user.name "flinkord-cli-helper"
          git fetch --tags
          LAST_TAG=$(git describe --tags $(git rev-list --tags --max-count=1) || echo "v0.0.0")
          echo "Last tag: $LAST_TAG"
          IFS='.' read -ra ADDR <<< "${LAST_TAG:1}" # Remove 'v' and split into array
          PATCH_VERSION=$((ADDR[2]+1))  # Increment patch version
          NEW_TAG="v${ADDR[0]}.${ADDR[1]}.$PATCH_VERSION"  # Construct new tag
          UNIQUE_VERSION_FOUND="false"
          while [ "$UNIQUE_VERSION_FOUND" = "false" ]; do
          if ! git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            UNIQUE_VERSION_FOUND="true"
            echo "New unique version found: $NEW_TAG"
            git tag $NEW_TAG
            git push origin --tags
            echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV  # Set NEW_TAG for subsequent steps
            RELEASE_NAME="${NEW_TAG:1}" # Remove 'v' for release name
            echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_ENV  # Set RELEASE_NAME for subsequent steps
          else
            echo "Tag $NEW_TAG already exists, incrementing further"
            PATCH_VERSION=$((PATCH_VERSION+1))  # Increment patch version
            NEW_TAG="v${ADDR[0]}.${ADDR[1]}.$PATCH_VERSION"  # Construct new tag
          fi
          done

      - name: Create a GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.NEW_TAG }}
          name: ${{ env.RELEASE_NAME }}  # Use RELEASE_NAME from env
          body: "New release ${{ env.RELEASE_NAME }}"  # Use RELEASE_NAME for body
          prerelease: true

      - name: Publish module
        run: |
          npm version ${NEW_TAG:1} --no-git-tag-version  # Update package.json version
          npm publish --tag latest --no-git-checks

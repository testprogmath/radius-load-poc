name: Bump version on PR merge

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches:
      - main
    types: [closed]

env:
  GCP_AUTH_WORKLOAD_IDENTITY_PROVIDER: projects/592763168884/locations/global/workloadIdentityPools/goflink-github-actions/providers/github-actions
  GCP_AUTH_SERVICE_ACCOUNT: flinkord-cli@flink-core-shared.iam.gserviceaccount.com
  NODE_VERSION: 18.x
  IDENTITY_SECRET: ${{secrets.IDENTITY_SECRET}}
  GENERIC_PASSWORD: ${{secrets.GENERIC_PASSWORD}}

permissions:
  id-token: write
  contents: write # This is required for actions/checkout@v3

jobs:
  bump-version:
    if: github.event.pull_request.merged == true && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ env.GCP_AUTH_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_AUTH_SERVICE_ACCOUNT }}

      - name: Install dependencies
        run: |
          npx google-artifactregistry-auth
          npm ci --cache .npm

      - name: Build application
        run: npm run build --if-present

      - name: Bump version and push tag
        run: |
          git config --global user.email "flinkord-cli-helper@goflink.com"
          git config --global user.name "flinkord-cli-helper"
          git fetch --tags
          CURRENT_TAG=$(git describe --tags `git rev-list --tags --max-count=1`)
          echo "Current tag: $CURRENT_TAG"
          VERSION_NUMBER=${CURRENT_TAG:1} # Remove the 'v' prefix
          NEW_TAG="v$(echo $VERSION_NUMBER | awk -F. '{$NF += 1;} 1' | sed 's/ /./g')"
          echo "New tag: $NEW_TAG"
          git tag $NEW_TAG
          git push origin --tags

      - name: Create a GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: $NEW_TAG
          name: "Release $NEW_TAG"
          body: "New release $NEW_TAG"
          prerelease: true

      - name: Publish module
        run: npm publish --no-git-checks

name: Bump version on PR merge

on:
  pull_request:
    branches:
      - main
    types: [closed]

env:
  GCP_AUTH_WORKLOAD_IDENTITY_PROVIDER: projects/592763168884/locations/global/workloadIdentityPools/goflink-github-actions/providers/github-actions
  GCP_AUTH_SERVICE_ACCOUNT: flinkord-cli@flink-core-shared.iam.gserviceaccount.com
  NODE_VERSION: 18.x
  IDENTITY_SECRET: ${{secrets.IDENTITY_SECRET}}
  GENERIC_PASSWORD: ${{secrets.GENERIC_PASSWORD}}

permissions:
  id-token: write
  contents: write # This is required for actions/checkout@v4

jobs:
  bump-version:
    if: github.event.pull_request.merged == true && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ env.GCP_AUTH_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_AUTH_SERVICE_ACCOUNT }}

      - name: Install dependencies
        run: |
          npx google-artifactregistry-auth
          npm ci --cache .npm

      - name: Build application
        run: npm run build --if-present

      - name: Bump version, create changelog and push
        run: |
          git config --global user.email "flinkord-cli-helper@goflink.com"
          git config --global user.name "flinkord-cli-helper"
          npx standard-version
          git push --follow-tags origin main
          npm publish --tag latest --no-git-checks

      - name: Create a GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref }}
          name: ${{ github.ref_name }}
          body: "New release ${{ github.ref_name }}"
          prerelease: true
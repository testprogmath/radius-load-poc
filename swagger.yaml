info:
  description: the purpose of the cart service is to offer an API to create, modify,
    and pay for carts.
  title: Cart API.
  version: 0.0.1
paths:
  /v1/cart:
    post:
      deprecated: true
      description: Creates a cart
      operationId: CreateCartV1
      responses:
        "200":
          description: CreateCartResponseV1
          schema:
            $ref: '#/definitions/CreateCartResponseV1'
      tags:
        - v1-cart
  /v1/cart/{id}:
    get:
      deprecated: true
      description: Retrieves all information related to cart
      operationId: GetCartV1
      parameters:
        - description: ID of a cart
          in: path
          name: id
          required: true
          type: string
          x-go-name: ID
      responses:
        "200":
          description: GetCartResponseV1
          schema:
            $ref: '#/definitions/GetCartResponseV1'
      tags:
        - v1-cart
    put:
      deprecated: true
      description: Updates cart with mutable information
      operationId: UpdateCartV1
      parameters:
        - description: ID is the cart ID
          in: path
          name: id
          required: true
